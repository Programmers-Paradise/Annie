[package]
name = "rust_annie-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Note: toolchain specification moved to rust-toolchain.toml file
# [toolchain]
# channel = "nightly"
# components = ["rust-src"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ndarray = "0.16"
[dependencies.rust_annie]
path = ".."

[[bin]]
name = "input_validation"
path = "fuzz_targets/input_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "distances"
path = "fuzz_targets/distances.rs"
test = false
doc = false
bench = false
