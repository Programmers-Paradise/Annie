[package]
name = "rust_annie"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Fast exact and approximate nearest-neighbour search for Python, implemented in Rust"
authors = ["Arnav Kapoor", "Abhinav Shukla"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Programmers-Paradise/Annie"
keywords = ["nearest-neighbor", "knn", "hnsw", "vector-search", "python"]
categories = ["algorithms", "science"]
exclude = ["benchmarks/", "paper/", "docs/", "scripts/", ".github/"]

[lib]
name = "rust_annie"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25.0" }
hnsw_rs = "0.3.4"
numpy = "0.25.0"
ndarray = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
rayon = "1.12.0"
lazy_static = { version = "1.4.0", optional = true }
bit-vec = { version = "0.10.0", features = ["serde"] }

# GPU backends
cust = { version = "0.3.0", optional = true }
hip-rs = { version = "1.0.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck"] }
thiserror = "2.0"

[features]
cuda = ["cust", "lazy_static"]
rocm = ["hip-rs", "lazy_static"]

# Forwarding features to control PyO3 from this crate
# Use these in CI/maturin instead of trying to enable dependency features directly.
python-ext = ["pyo3/extension-module"]
python-abi3 = ["pyo3/abi3-py39"]
# On Windows, generate an import library for python3.dll when needed
pyo3-import-lib = ["pyo3/generate-import-lib"]

[workspace]
members = [".", "fuzz"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "ann_bench"
harness = false
