# Experimental ROCm (AMD GPU) build. GitHub-hosted runners have no AMD GPU, so
# this only runs manually, on a self-hosted runner labelled `rocm`.
name: ROCm (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocm:
    runs-on: [self-hosted, rocm]
    container:
      image: rocm/dev-ubuntu-22.04:latest
      options: --device=/dev/kfd --device=/dev/dri --group-add video
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y build-essential pkg-config libclang-dev python3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features rocm
      - run: cargo test --features rocm
