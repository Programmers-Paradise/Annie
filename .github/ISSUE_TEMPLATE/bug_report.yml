name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the full traceback.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: rust_annie 0.3.0, Python 3.12, numpy 2.1, Ubuntu 24.04
    validations:
      required: true
