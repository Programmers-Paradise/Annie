version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # bincode 3.0.0 is a tombstone release (compile_error only) after the
      # project was discontinued; 2.x changes the encoding of saved indexes.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned on purpose: the MSRV job must test the minimum supported Rust.
      - dependency-name: dtolnay/rust-toolchain
